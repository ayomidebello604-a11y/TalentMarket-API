# Throwaway infrastructure for automated tests only.
# Separate project name, container names, ports and in-memory storage,
# so it can never touch the development database from docker-compose.yml.
name: talentmarket-test

services:
  postgres-test:
    image: postgres:18
    container_name: talentmarket-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talentmarket_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentmarket_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:8
    container_name: talentmarket-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15